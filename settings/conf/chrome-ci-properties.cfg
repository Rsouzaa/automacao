; Chrome headless, with Selenium Manager choosing the driver.
[Driver]
type : chrome
chrome_driver_path : chromedriver.exe
headless : true
implicitly_wait : 20
explicitly_wait : 25
reuse_driver_session : false
restart_driver_after_failure : true

[Server]
enabled : false

[Capabilities]
acceptInsecureCerts : true

[ChromeArguments]
disable-gpu : true
disable-dev-shm-usage : true
